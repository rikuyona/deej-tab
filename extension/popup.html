<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>deej タブ音量</title>
<link rel="stylesheet" href="popup.css">
<body>
  <header>
    <img src="icons/icon32.png" alt="" width="20" height="20">
    <span class="brand" data-i18n="name">deej タブ音量</span>
    <span id="status" class="pill"><i></i><span data-i18n="checking">確認中</span></span>
  </header>

  <section class="current" id="current">
    <img id="current-icon" alt="" width="16" height="16" hidden>
    <div class="current-text">
      <span class="label" data-i18n="thisTab">このタブ</span>
      <span id="current-title" class="title"></span>
    </div>
  </section>
  <p id="unsupported" class="note" data-i18n="unsupported" hidden>このページ（Chrome の設定画面など）の音量は変えられません</p>

  <section>
    <ul id="slots"></ul>
    <div id="empty" class="empty" hidden>
      <b data-i18n="emptyTitle">割り当てられる番号がありません</b>
      <span data-i18n="emptyText">deej-tab の設定画面で、スライダーに<br>「Chrome タブ 1」などを割り当てると、ここに出ます</span>
    </div>
    <p id="error" class="error" role="alert" hidden></p>
    <p class="hint" data-i18n-html="hint">ポップアップを開かなくても、<b>Alt+Shift+A</b>（空いている番号へ。押すたびに次へ移り、最後は解除）・<b>Alt+Shift+1〜2</b>・ページの右クリック →「deej タブ音量」で割り当てられます（キーは chrome://extensions/shortcuts で変更可）</p>
  </section>

  <section class="auto">
    <label class="switch">
      <input type="checkbox" id="auto-assign">
      <span data-i18n="autoLabel">音が鳴ったタブを自動で割り当てる</span>
    </label>
    <p id="auto-hint" class="hint"></p>
  </section>

  <section class="method">
    <h2 data-i18n="methodTitle">音量の変え方</h2>
    <div class="seg" role="radiogroup" aria-label="音量の変え方" data-i18n-aria="methodTitle">
      <button data-method="Y" role="radio" data-i18n="methodY">タブの音をまとめて調整</button>
      <button data-method="X" role="radio" data-i18n="methodX">ページ内の動画の音量を変える</button>
    </div>
    <p id="method-hint" class="hint"></p>
  </section>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
